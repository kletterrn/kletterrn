<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">David Khaliqi — Curiosity, made real.</title><desc id="desc">An editorial black and cream header with an abstract violet wireframe globe with intersecting orbital rings.</desc>
